[project]
name = "mes-ai"
version = "1.6.0"
description = "Open-source Manufacturing Execution System framework with plugin architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.1",
    "tzdata>=2024.1",
]

[project.scripts]
mes = "mes.cli:main"

[project.optional-dependencies]
# ── Database drivers (install exactly one) ────────────────────────────
# PostgreSQL — async, recommended default:
#   pip install "mes-ai[postgres]"
#   DATABASE_URL = postgresql+asyncpg://user:password@host:5432/mes_ai
postgres = [
    "asyncpg>=0.29.0",
]
# SQL Server — sync only (pyodbc has no async driver):
#   pip install "mes-ai[mssql]"
#   DATABASE_URL = mssql+pyodbc://user:password@host/mes_ai?driver=ODBC+Driver+18+for+SQL+Server
mssql = [
    "pyodbc>=5.1.0",
]
# Oracle — sync only:
#   pip install "mes-ai[oracle]"
#   DATABASE_URL = oracle+oracledb://user:password@host:1521/?service_name=mes_ai
oracle = [
    "oracledb>=2.1.0",
]
# ── Equipment / integration protocol extras ───────────────────────────
opcua = [
    "asyncua>=1.1.0",
]
mqtt = [
    "aiomqtt>=2.0.0",
]
sap = [
    "pyrfc>=3.3",
]
modbus = [
    "pymodbus>=3.6.0",
]
redis = [
    "redis[hiredis]>=5.0.0",
]
stomp = [
    "stomp-py>=8.1.0",
]
aveva = [
    "httpx-ntlm>=1.4.0",
]
all = [
    "mes-ai[postgres,mssql,oracle,opcua,mqtt,sap,modbus,redis,stomp,aveva]",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "pyright>=1.1.355",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "plugins"]
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*"]
strict = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:cannot collect test class.*:pytest.PytestCollectionWarning",
    "ignore:'locale.getdefaultlocale' is deprecated.*:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
