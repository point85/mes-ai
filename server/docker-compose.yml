# MES AI — Development services
# Usage: docker compose up -d
# Stops: docker compose down
# Reset: docker compose down -v  (deletes data)

services:
  postgres:
    image: postgres:16
    container_name: mes-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mes_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
