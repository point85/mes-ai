# Alembic configuration for MES AI
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision identifiers
truncate_slug_length = 40

# sys.path prepend — lets Alembic find the `mes` package
prepend_sys_path = src

# timezone for file_template date fields
# timezone = UTC

# The SQLAlchemy URL is set programmatically in env.py from mes.config.settings,
# so the value below is only a fallback and should NOT be edited manually.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/mes_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
