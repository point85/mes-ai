id: example-dispatch-plugin
name: Example Dispatch Plugin
version: "0.1.0"
description: >
  Demonstrates the plugin framework by providing a "priority_weighted"
  dispatch strategy and reacting to WIP movement events.
author: MES AI Contributors
min_mes_version: "0.1.0"

permissions:
  - id: example_dispatch.config.read
    description: View example dispatch plugin configuration

required_core_permissions:
  - dispatch.read
  - wip.read

extension_points:
  - type: dispatch_strategy
    name: priority_weighted

event_subscriptions:
  - wip.unit.moved

dependencies: []

config_schema:
  type: object
  properties:
    priority_weight:
      type: number
      default: 0.6
      description: Weight given to order priority vs queue length (0-1)
    queue_weight:
      type: number
      default: 0.4
      description: Weight given to shortest-queue score (0-1)
