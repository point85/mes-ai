id: file-drop-test-results
name: File-Drop Test Results Collector
version: "1.0.0"
description: >
  Watches a configured directory for text files produced by test equipment.
  Each file is parsed for test measurements, a result record is written to
  a database table, and the file is moved to a "successful" or "failed"
  subfolder depending on the DB write outcome.
  Includes a built-in simulator that periodically generates sample files.
author: MES AI Contributors
comment: System plugin for collecting test equipment results via file drops.
category: data-collection
origin: system
min_mes_version: "0.1.0"

permissions:
  - id: file_drop.config.read
    description: View file-drop collector configuration
  - id: file_drop.config.write
    description: Modify file-drop collector configuration
  - id: file_drop.results.read
    description: View collected test results

required_core_permissions:
  - data_collection.write

extension_points:
  - type: data_processor
    name: file_drop_test_results
  - type: rest_endpoint
    prefix: /api/v1/plugins/file-drop

event_subscriptions: []

dependencies: []

parameters:
  - name: watch_dir
    type: string
    description: Directory to poll for new test result files
    required: false
    default: "./watch/test_results"
  - name: poll_interval_seconds
    type: number
    description: How often (seconds) to scan for new files
    required: false
    default: 5.0
  - name: file_pattern
    type: string
    description: Glob pattern for result files
    required: false
    default: "*.txt"
  - name: db_url
    type: string
    description: >
      Database URL for storing results.  Leave empty to use the MES
      server's default database.
    required: false
    default: ""
  - name: db_table
    type: string
    description: Table name for storing parsed test results
    required: false
    default: plugin_file_drop_results
  - name: simulator_enabled
    type: boolean
    description: If true, periodically generate sample test files for demo
    required: false
    default: false
  - name: simulator_interval_seconds
    type: number
    description: How often (seconds) the simulator creates a new file
    required: false
    default: 8.0
  - name: simulator_failure_rate
    type: number
    description: Probability (0-1) that a simulated DB write will fail
    required: false
    default: 0.2
