// kafka_bridge.proto — copy kept here for Maven protobuf-maven-plugin.
// The canonical version lives at:
//   ../../../proto/kafka_bridge.proto
// Keep both files in sync whenever the contract changes.

syntax = "proto3";

package mesbridge;

option java_package         = "com.point85.mes.bridge.proto";
option java_outer_classname = "KafkaBridgeProto";
option java_multiple_files  = true;

service KafkaBridge {
  rpc Subscribe   (SubscribeRequest) returns (stream KafkaMessage);
  rpc Publish     (PublishRequest)   returns (PublishResponse);
  rpc HealthCheck (HealthRequest)    returns (HealthResponse);
}

message SubscribeRequest {
  repeated string topics          = 1;
  string          consumer_group  = 2;
  int64           poll_timeout_ms = 3;
}

message KafkaMessage {
  string              topic        = 1;
  int32               partition    = 2;
  int64               offset       = 3;
  string              key          = 4;
  bytes               value        = 5;
  int64               timestamp_ms = 6;
  map<string, string> headers      = 7;
}

message PublishRequest {
  string              topic   = 1;
  string              key     = 2;
  bytes               value   = 3;
  map<string, string> headers = 4;
}

message PublishResponse {
  bool   success   = 1;
  string error     = 2;
  int32  partition = 3;
  int64  offset    = 4;
}

message HealthRequest {}

message HealthResponse {
  bool   healthy      = 1;
  string version      = 2;
  string kafka_broker = 3;
}
