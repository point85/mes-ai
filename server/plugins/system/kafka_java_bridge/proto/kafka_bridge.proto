// kafka_bridge.proto
// gRPC service contract between the MES Python plugin (client)
// and the Java Kafka bridge process (server).
//
// SOURCE OF TRUTH — edit here, then regenerate stubs:
//   Python: python proto/generate_stubs.py
//   Java:   mvn -f bridge/pom.xml generate-sources
//
// Proto path layout:
//   Python stubs → plugins/system/kafka_java_bridge/proto/
//   Java sources → bridge/src/main/java/ (generated by protobuf-maven-plugin)

syntax = "proto3";

package mesbridge;

option java_package         = "com.point85.mes.bridge.proto";
option java_outer_classname = "KafkaBridgeProto";
option java_multiple_files  = true;

// ─────────────────────────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────────────────────────

service KafkaBridge {
  // Begin consuming from one or more Kafka topics.
  // The Java bridge opens a KafkaConsumer, polls indefinitely, and streams
  // every received record back to the Python plugin as a KafkaMessage.
  // The stream stays open until the Python client cancels it or the bridge
  // encounters an unrecoverable error.
  rpc Subscribe(SubscribeRequest) returns (stream KafkaMessage);

  // Publish a single message to Kafka via KafkaProducer.
  // Returns partition + offset on success, or an error description on failure.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Liveness / readiness probe.
  // The Python plugin polls this during start-up to detect when the JVM and
  // Kafka consumer/producer are ready to accept traffic.
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Subscribe
// ─────────────────────────────────────────────────────────────────────────────

message SubscribeRequest {
  // One or more Kafka topic names to subscribe to.
  repeated string topics         = 1;

  // Kafka consumer group ID.  Defaults to "mes-kafka-bridge" in the bridge.
  string          consumer_group = 2;

  // How long the Java KafkaConsumer.poll() blocks per iteration (milliseconds).
  // 0 → bridge uses its default (1000 ms).
  int64           poll_timeout_ms = 3;
}

message KafkaMessage {
  string              topic        = 1;
  int32               partition    = 2;
  int64               offset       = 3;
  string              key          = 4;
  bytes               value        = 5;
  // Epoch milliseconds from the Kafka record timestamp.
  int64               timestamp_ms = 6;
  map<string, string> headers      = 7;
}

// ─────────────────────────────────────────────────────────────────────────────
// Publish
// ─────────────────────────────────────────────────────────────────────────────

message PublishRequest {
  string              topic   = 1;
  // Optional message key.  Empty string → null key (Kafka round-robin).
  string              key     = 2;
  bytes               value   = 3;
  map<string, string> headers = 4;
}

message PublishResponse {
  bool   success   = 1;
  // Human-readable error; empty on success.
  string error     = 2;
  int32  partition = 3;
  int64  offset    = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Health check
// ─────────────────────────────────────────────────────────────────────────────

message HealthRequest {}

message HealthResponse {
  bool   healthy      = 1;
  // Bridge version string (set from Maven project version at build time).
  string version      = 2;
  // The bootstrap.servers value the bridge was started with.
  string kafka_broker = 3;
}
