version: "1.0"
providers:
  - id: openai
    model: gpt-4o # High visual reasoning needed for UI interaction and screenshot analysis
agents:
  - id: ui-auditor
    name: "MES AI QA Engineer"
    soul: ./.openclaw/souls/qa_tester.md
    tools:
      - name: browser
        config:
          headless: false  # headed so screenshots capture real UI state
      - name: terminal
        config:
          workdir: c:\dev\mes_ai  # workspace root so pytest can find SQA/modules/
    memory:
      type: local
      path: ./.openclaw/memory