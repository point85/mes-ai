[pytest]
testpaths = SQA/modules
addopts =
    -ra
    --strict-markers
    -p no:anyio
    --html=SQA/reports/latest/report.html
    --self-contained-html
    --junitxml=SQA/reports/latest/junit.xml

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    smoke:          60-second post-deploy gate — no seed required
    ui:             Playwright browser tests against a running client
    api:            Pure HTTP contract tests against the MES server
    ws:             WebSocket event tests
    e2e:            Full end-to-end scenario spanning multiple surfaces
    slow:           Tests that take more than 30 seconds
    requires_seed:  Needs reset_and_seed.py to run first
