# MES AI — Production Docker Compose
#
# Quick start:
#   Windows : .\install.ps1
#   macOS/Linux: ./install.sh
#
# Manual:
#   docker compose up -d            build locally + start all services
#   docker compose down             stop (data preserved)
#   docker compose down -v          stop + wipe database
#   docker compose pull && docker compose up -d   pull pre-built images and restart
#
# To use pre-built images from the registry instead of building locally,
# set MES_IMAGE_TAG in .env to a published tag (e.g. 1.0.0).

name: mes-ai

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: mes-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-mes_ai_s95}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MES Server (FastAPI + uvicorn) ──────────────────────────────────────────
  mes-server:
    image: ghcr.io/point85/mes-ai-server:${MES_IMAGE_TAG:-local}
    build:
      context: server
      dockerfile: Dockerfile
    container_name: mes-server
    restart: unless-stopped
    ports:
      - "${PORT_SERVER:-8082}:8082"
    environment:
      MES_DATABASE_URL:  postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mes_ai_s95}
      MES_AUTH_MODE:     ${MES_AUTH_MODE:-none}
      MES_SECRET_KEY:    ${MES_SECRET_KEY:-change-me-in-production}
      MES_LOG_LEVEL:     ${MES_LOG_LEVEL:-INFO}
      MES_EVENT_BUS_TYPE: ${MES_EVENT_BUS_TYPE:-memory}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Design-Time Client (DT) ─────────────────────────────────────────────────
  dt-client:
    image: ghcr.io/point85/mes-ai-dt:${MES_IMAGE_TAG:-local}
    build:
      context: clients
      dockerfile: design_time/Dockerfile
    container_name: mes-dt
    restart: unless-stopped
    ports:
      - "${PORT_DT:-5173}:80"
    depends_on:
      mes-server:
        condition: service_healthy

  # ── Run-Time Client (RT) ────────────────────────────────────────────────────
  rt-client:
    image: ghcr.io/point85/mes-ai-rt:${MES_IMAGE_TAG:-local}
    build:
      context: clients
      dockerfile: run_time/Dockerfile
    container_name: mes-rt
    restart: unless-stopped
    ports:
      - "${PORT_RT:-5176}:80"
    depends_on:
      mes-server:
        condition: service_healthy

  # ── ERP Simulator ───────────────────────────────────────────────────────────
  erp-sim:
    image: ghcr.io/point85/mes-ai-erp:${MES_IMAGE_TAG:-local}
    build:
      context: clients
      dockerfile: erp_simulator/Dockerfile
    container_name: mes-erp
    restart: unless-stopped
    ports:
      - "${PORT_ERP_SIM:-5174}:80"
    depends_on:
      mes-server:
        condition: service_healthy

  # ── Equipment Simulator ─────────────────────────────────────────────────────
  equip-sim:
    image: ghcr.io/point85/mes-ai-equip:${MES_IMAGE_TAG:-local}
    build:
      context: clients
      dockerfile: equipment_simulator/Dockerfile
    container_name: mes-equip
    restart: unless-stopped
    ports:
      - "${PORT_EQUIP_SIM:-5175}:80"
    depends_on:
      mes-server:
        condition: service_healthy

volumes:
  pgdata:
    name: mes-ai-pgdata
