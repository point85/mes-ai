# nginx config for MES AI React clients (served as static SPA)
#
# All four clients (DT, RT, ERP-sim, Equip-sim) use this identical config.
# nginx proxies /api/* to the mes-server container on the Docker network.
# All other requests are served as static files with SPA fallback.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Proxy API + WebSocket calls to the MES server
    location /api/ {
        proxy_pass         http://mes-server:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade support (used by RT client SSE/WS events)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # SPA fallback — always return index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy       strict-origin-when-cross-origin;
}
