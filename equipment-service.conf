# ---------------------------------------------------------------------------
# MES AI Client Service Configuration
# Edit the values for your environment.
# Lines beginning with # are comments and are ignored.
#
# Use one copy of this file per client:
#   rt-service.conf          Run-Time client      (port 5176)
#   dt-service.conf          Design-Time client   (port 5173)
#   erp-service.conf         ERP Simulator        (port 5174)
#   equipment-service.conf   Equipment Simulator  (port 5175)
# ---------------------------------------------------------------------------

# ── Client selection ─────────────────────────────────────────────────────────
# Which Vite client to run as a service.
# Valid values: dt-client | rt-client | erp-sim | equipment-sim
Client             = equipment-sim

# ── Service identity ─────────────────────────────────────────────────────────
ServiceName        = MesAI-Equipment-Simulator-Client
ServiceDisplayName = MES AI Equipment Simulator Client
ServiceDescription = MES AI Equipment Simulator Client Vite server

# ── Network settings ─────────────────────────────────────────────────────────
# Port the Vite dev server listens on
Port               = 5175

# Bind host (0.0.0.0 = all interfaces, 127.0.0.1 = loopback only)
BindHost           = 0.0.0.0

# MES server URL the client proxies API calls to
ServerUrl          = http://localhost:8082

# ── Service startup ───────────────────────────────────────────────────────────
# Start type: auto | delayed-auto | manual | disabled
StartType          = manual

# ── Logging ───────────────────────────────────────────────────────────────────
# Directory for stdout/stderr logs.
# Default: <repo>/clients/<client-dir>/logs
LogDir             =

# ── Linux only ────────────────────────────────────────────────────────────────
# User and group to run the service as.
# Defaults to the invoking sudo user when left blank.
ServiceUser        =
ServiceGroup       =
